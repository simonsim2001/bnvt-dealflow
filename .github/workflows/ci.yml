name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile server.py
      - name: Security & storage tests
        run: python tests/test_security.py
      - name: Built bundle is present and parses
        run: |
          test -s bnvt-dealflow.js
          npx --yes acorn@8 --ecma2022 --silent bnvt-dealflow.js
