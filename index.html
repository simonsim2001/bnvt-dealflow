    <style>
        body {

            /* 4. Table Containers: Swipe horizontally, auto wrap cell containers, keep headings well aligned */
            div:has(> table), 
            div[style*="overflow-x: auto"] {

                -webkit-overflow-scrolling: touch;

                border: 1px solid #E5E5E0 !important;

            th, td {

                word-break: keep-all !important;

            /* 5. Buttons: clean sizes, never cut words, make them small and perfectly fitted */

                padding: 6px 10px !important;

            /* 6. Form inputs and select controls styling */
            input, select, textarea, .bnvt-input, .bnvt-textarea {
                max-width: 100% !important;
                font-size: 14px !important;

            /* 7. Side Drawer & Modals become mobile bottom sheets */
            div[style*="width: 320px"],

            div[style*="width: 400px"],

                position: fixed !important;
                left: 0 !important;

                bottom: 0 !important;
                top: auto !important;
                height: 85% !important;
                border-radius: 16px 16px 0 0 !important;
                border-left: none !important;
                border-top: 2px solid #000 !important;
                z-index: 1000 !important;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.15) !important;
                overflow-y: auto !important;
            }

            /* 8. Spacers and wrappers adjustments */
            div[style*="gap: 24px"], div[style*="gap: 20px"] {
                gap: 12px !important;
            }
        }
        /* ---- SL Deals: phone layout (iPhone 16 Pro = 393pt wide) ---- */
        .mobile-only { display: none !important; }
        @media (max-width: 768px) {
            .mobile-only { display: flex !important; }
            div.mobile-only[style*="inset"] { display: block !important; }
            .desktop-only { display: none !important; }
            html, body { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
            .app-header { position: sticky; top: 0; z-index: 1500; background: rgba(255,255,255,0.96) !important;
                -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
                padding: calc(8px + env(safe-area-inset-top)) 14px 6px 14px !important;
                flex-direction: row !important; align-items: center !important; }
            .app-header > div:first-child { width: 100%; }
            .app-header > div:first-child > div { flex-wrap: nowrap !important; justify-content: space-between; align-items: center !important; gap: 8px !important; width: 100%; }
            .app-title { font-size: 22px !important; margin-bottom: 0 !important; font-weight: 700; }
            .header-actions { margin-bottom: 0 !important; gap: 6px !important; }
            .header-actions .bnvt-btn { padding: 6px 9px !important; min-height: 34px; }
            .header-actions kbd { display: none !important; }
            .app-body { padding: 14px 14px calc(96px + env(safe-area-inset-bottom)) 14px !important; }
            input, select, textarea { font-size: 16px !important; }
            .bnvt-btn { min-height: 40px; }
            .voice-agent { min-height: calc(100vh - 200px) !important; }
            .voice-controls { bottom: calc(64px + env(safe-area-inset-bottom)) !important; padding-bottom: 10px; }
            #reading-library > div:last-of-type, #reading-library div[style*="overflow-x: auto"] { scroll-snap-type: x mandatory; border: none !important; }
            #reading-library div[style*="flex: 0 0 280px"] { flex: 0 0 86vw !important; scroll-snap-align: start; }
            #reports-tab { grid-template-columns: 1fr !important; }
            #reading-detail { padding: calc(20px + env(safe-area-inset-top)) 18px 24px !important; }
            h2 { font-size: 22px !important; }
        }
        .voice-mic.listening { animation: slPulse 1.4s ease-in-out infinite; }
        @keyframes slPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(17,17,17,0.35); } 50% { box-shadow: 0 0 0 14px rgba(17,17,17,0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        @media (max-width: 768px) {
            .header-actions { display: none !important; }
            .app-header { padding-bottom: 10px !important; border-bottom: 1px solid #EEE !important; }
            .app-title { font-size: 20px !important; }
            #mobile-pipeline div, #mobile-pipeline span { word-break: normal; overflow-wrap: break-word; }
            .live-voice { min-height: calc(100vh - 210px) !important; }
        }
        /* phone text wrapping fix */
        @media (max-width: 768px) {
            p, li, span, div, h1, h2, h3, h4, h5, h6, td, th, a, label, button { word-break: normal !important; overflow-wrap: break-word !important; }
            .app-body div[style*="space-between"] { flex-wrap: wrap !important; }
            .app-body h1, .app-body h2 { min-width: 0; }
        }

<body>
    <div id="root"></div>
    <script>
        // Set up PDF.js worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }

        // Polyfill window.storage using localStorage since it's used in the app for persistence
        // We override this to sync storage to/from the server, enabling WhatsApp webhook to write directly to the db.
        // Secrets live on the server. The browser only has masked placeholders ("••••abcd"),
        // which browsers refuse to send in headers. Drop them so the server uses its stored key.
        const _origFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
            if (init && init.headers && !(init.headers instanceof Headers)) {
                const h = {};
                for (const [k, v] of Object.entries(init.headers)) {
                    if (typeof v === "string" && (v.startsWith("\u2022") || /[^\x00-\xFF]/.test(v))) continue;
                    h[k] = v;
                }
                init = { ...init, headers: h };
            }
            return _origFetch(input, init);
        };

        const originalSetItem = localStorage.setItem;
        // The main DB is far larger than the browser's ~5MB localStorage quota.
        // The server is the source of truth for it; never cache it locally, because a
        // stale local copy would override newer server values on the next boot.
        const SERVER_ONLY_KEYS = new Set(["bnvt-dealflow-v1"]);
        try { localStorage.removeItem("bnvt-dealflow-v1"); } catch (e) {}
        const safeLocalSet = (key, value) => {
            if (SERVER_ONLY_KEYS.has(key)) return;
            try { originalSetItem.call(localStorage, key, value); }
            catch (e) { console.warn("localStorage cache skipped for", key, e && e.name); }
        };
        window.__bnvtSaveFailed = false;
        localStorage.setItem = function(key, value) {
            safeLocalSet(key, value);
            // Always push to the server, even if the local cache write failed.
            fetch('/api/storage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, value })
            })
            .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                window.__bnvtSaveFailed = false;
                return res.json();
            })
            .catch(err => {
                window.__bnvtSaveFailed = true;
                console.error("SAVE TO SERVER FAILED for", key, err);
            });
        };

        if (!window.storage) {
            window.storage = {
                get: async (key) => {
                    try {
                        const res = await fetch(`/api/storage?key=${encodeURIComponent(key)}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.value !== undefined && data.value !== null) {
                                return { value: data.value };
                            }
                        }
                    } catch (e) {
                        console.warn("Server storage get failed, falling back to localStorage", e);
                    }
                    try {
                        const val = localStorage.getItem(key);
                        return val ? { value: val } : null;
                    } catch (e) {
                        console.error("Storage get error", e);
                        return null;
                    }
                },
                set: async (key, value) => {
                    try {
                        localStorage.setItem(key, value);
                    } catch (e) {
                        console.error("Storage set error", e);
                    }
                }
            };
        }
    </script>
    <!-- Load pre-compiled App component for instant zero-lag loading -->
    <script src="bnvt-dealflow.js?v=74.1"></script>
    <!-- Render the App once it's loaded and defined on window -->
    <script>
        function mergeNotesJS(cNotes = [], sNotes = []) {
            const arrC = Array.isArray(cNotes) ? cNotes : (cNotes ? [{ text: String(cNotes) }] : []);
            const arrS = Array.isArray(sNotes) ? sNotes : (sNotes ? [{ text: String(sNotes) }] : []);
            const map = new Map();
            for (const n of arrS) {
                if (!n) continue;
                const key = typeof n === "object" ? (n.id || n.ts || n.date || n.text || JSON.stringify(n)) : String(n).trim();
                if (key) map.set(key, n);
            }
            for (const n of arrC) {
                if (!n) continue;
                const key = typeof n === "object" ? (n.id || n.ts || n.date || n.text || JSON.stringify(n)) : String(n).trim();
                if (key) map.set(key, n);
            }
            const res = Array.from(map.values());
            try {
                res.sort((a, b) => {
                    const tA = (a && typeof a === "object") ? (a.date || a.ts || a.createdAt || 0) : 0;
                    const tB = (b && typeof b === "object") ? (b.date || b.ts || b.createdAt || 0) : 0;
                    return tB - tA;
                });
            } catch(e) {}
            return res;
        }

        function mergeSubListJS(cSub = [], sSub = [], idKeys = ["id", "name", "url", "text"]) {
            const arrC = Array.isArray(cSub) ? cSub : [];
            const arrS = Array.isArray(sSub) ? sSub : [];
            const map = new Map();
            const getKey = (item) => {
                if (item && typeof item === "object") {
                    for (const k of idKeys) {
                        if (item[k]) return String(item[k]);
                    }
                }
                return String(item);
            };
            for (const item of arrS) {
                if (item) map.set(getKey(item), item);
            }
            for (const item of arrC) {
                if (!item) continue;
                const k = getKey(item);
                if (map.has(k) && typeof item === "object" && typeof map.get(k) === "object") {
                    map.set(k, { ...map.get(k), ...item });
                } else {
                    map.set(k, item);
                }
            }
            return Array.from(map.values());
        }

        function mergeItemsJS(cItem, sItem) {
            if (!sItem) return cItem;
            if (!cItem) return sItem;
            const merged = { ...sItem };
            
            const cTs = cItem.updatedAt || cItem.ts || 0;
            const sTs = sItem.updatedAt || sItem.ts || 0;

            for (const [key, cVal] of Object.entries(cItem)) {
                const sVal = sItem[key];
                if (key === "notes") {
                    merged.notes = mergeNotesJS(cVal, sVal);
                } else if (["founders", "assets", "documents", "qa", "deckIngestHistory"].includes(key)) {
                    merged[key] = mergeSubListJS(cVal, sVal);
                } else if (cVal && typeof cVal === "object" && !Array.isArray(cVal) && sVal && typeof sVal === "object" && !Array.isArray(sVal)) {
                    merged[key] = { ...sVal, ...cVal };
                } else {
                    if (cVal === undefined || cVal === null || cVal === "" || (Array.isArray(cVal) && cVal.length === 0)) {
                        if (sVal !== undefined && sVal !== null && sVal !== "" && (!Array.isArray(sVal) || sVal.length > 0)) {
                            merged[key] = sVal;
                        } else {
                            merged[key] = cVal;
                        }
                    } else if (sTs > cTs && sTs > 0 && sVal !== undefined && sVal !== null && sVal !== "") {
                        merged[key] = sVal;
                    } else {
                        merged[key] = cVal;
                    }
                }
            }
            for (const [key, sVal] of Object.entries(sItem)) {
                if (!(key in cItem) && sVal !== undefined) {
                    merged[key] = sVal;
                }
            }
            return merged;
        }

        function mergeLists(clientList, serverList, deletedIds = [], keyAttr = "id") {
            const deletedSet = new Set((deletedIds || []).map(String));
            const clientArr = (Array.isArray(clientList) ? clientList : []).filter(item => item && item[keyAttr] && !deletedSet.has(String(item[keyAttr])));
            const serverArr = (Array.isArray(serverList) ? serverList : []).filter(item => item && item[keyAttr] && !deletedSet.has(String(item[keyAttr])));
            
            const serverMap = new Map();
            for (const item of serverArr) {
                serverMap.set(String(item[keyAttr]), item);
            }
            const clientMap = new Map();
            for (const item of clientArr) {
                clientMap.set(String(item[keyAttr]), item);
            }

            const mergedResult = [];
            for (const cItem of clientArr) {
                const idStr = String(cItem[keyAttr]);
                const sItem = serverMap.get(idStr);
                mergedResult.push(mergeItemsJS(cItem, sItem));
            }
            for (const sItem of serverArr) {
                const idStr = String(sItem[keyAttr]);
                if (!clientMap.has(idStr)) {
                    mergedResult.unshift(sItem);
                }
            }
            return mergedResult;
        }

        let isRendered = false;
        const preSyncAndRender = async () => {
            try {
                const keys = [
                    "anthropic_api_key", "affinity_api_key", "granola_api_key", "bnvt-dealflow-v1",
                    "llm_config", "groq_api_key", "openrouter_api_key", "deepseek_api_key", "openai_api_key"
                ];
                for (const key of keys) {
                    const res = await fetch(`/api/storage?key=${encodeURIComponent(key)}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.value !== undefined && data.value !== null) {
                            // Main DB stays server-only (see SERVER_ONLY_KEYS); safeLocalSet skips it.
                            safeLocalSet(key, data.value);
                        }
                    }
                }
            } catch (e) {
                console.warn("Failed to pre-sync storage from server:", e);
            }
            
            let attempts = 0;
            const checkAndRender = () => {
                if (isRendered) return;
                attempts++;
                if (window.App) {
                    isRendered = true;
                    try {
                        if (!window.reactRoot) {
                            window.reactRoot = ReactDOM.createRoot(document.getElementById('root'));
                        }
                        const AppComp = window.App;
                        const Boundary = window.ErrorBoundary;
                        window.reactRoot.render(
                            React.createElement(
                                React.StrictMode,
                                null,
                                Boundary ? React.createElement(Boundary, null, React.createElement(AppComp)) : React.createElement(AppComp)
                            )
                        );
                    } catch (renderErr) {
                        console.error("Render error:", renderErr);
                        document.getElementById('root').innerHTML = `
                            <div style="padding: 40px; text-align: center; font-family: sans-serif;">
                                <h2>Application Error</h2>
                                <p style="color: red;">${renderErr.message}</p>
                                <button onclick="localStorage.clear(); location.reload();" style="padding: 10px 20px; font-size: 14px; cursor: pointer;">Clear Local Cache & Reload</button>
                            </div>
                        `;
                    }
                } else if (attempts < 600) {
                    setTimeout(checkAndRender, 50);
                } else {
                    document.getElementById('root').innerHTML = `
                        <div style="padding: 40px; text-align: center; font-family: sans-serif;">
                            <h2>Loading Timeout</h2>
                            <p style="color: #666;">The application component took too long to load.</p>
                            <button onclick="localStorage.clear(); location.reload();" style="padding: 10px 20px; font-size: 14px; cursor: pointer;">Clear Local Cache & Reload</button>
                        </div>
                    `;
                }
            };
            checkAndRender();
        };
        preSyncAndRender();
    </script>
</body>
